<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Modulators</title>
  <style>
    :root, [data-theme="dark"] {
      --plate: #141619; --panel: #1d2024; --panel2: #24282d; --well: #101215; --edge: #2c3036;
      --text: #f1f0ec; --dim: #858a93; --silk: #b9bdc5; --acc: #b57bff; --acc2: #ff5fb0; --ink: #1a0f1f;
      --ok: #3ddc84; --bad: #ff5a6a; color-scheme: dark;
    }
    [data-theme="grey"] {
      --plate: #4a4e55; --panel: #555a62; --panel2: #5d626a; --well: #41454b; --edge: #6a6f78;
      --text: #f6f5f1; --dim: #c9ccd1; --silk: #e1e3e6; --acc: #c99bff; --acc2: #ff86c3; --ink: #1a0f1f;
      --ok: #7ef0ae; --bad: #ff9aa3;
    }
    /* What is being modulated sets the colours: mixer (default), sends, plug-ins */
    [data-kind="send"] { --acc: #4cc3ff; --acc2: #5b6cff; --ink: #06131f; }
    [data-kind="fx"] { --acc: #2ee6a6; --acc2: #9be14a; --ink: #0b1a10; }
    [data-theme="grey"][data-kind="send"] { --acc: #7fd4ff; --acc2: #8f9bff; }
    [data-theme="grey"][data-kind="fx"] { --acc: #5ff0bd; --acc2: #b8ee7a; }
    /* Modulated parameters wear their category's colour */
    .k-mix { --kc: #c08bff; } .k-send { --kc: #5cc8ff; } .k-fx { --kc: #39e3a5; }
    [data-theme="grey"] .k-mix { --kc: #d9b6ff; } [data-theme="grey"] .k-send { --kc: #9adcff; } [data-theme="grey"] .k-fx { --kc: #7ff2c6; }
    .item { display: flex; align-items: center; gap: 6px; }
    .item.mod { color: var(--kc); font-weight: 800; }
    .item.top { padding-left: 10px; }
    .wv { width: 15px; height: 10px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
    .ghead .wv { color: var(--silk); }
    .modn { display: inline-flex; align-items: center; gap: 3px; font-size: 10.5px; color: var(--kc); font-weight: 800; }
    .sep { height: 1px; background: var(--edge); margin: 6px 4px; }
    #pickBtn.mod { color: var(--acc); }
    #wave .ghost { fill: none; stroke: var(--text); stroke-width: 1.4; opacity: .35; stroke-dasharray: 4 3; }
    .kdot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
    .kdot.mix { background: linear-gradient(135deg, #b57bff, #ff5fb0); }
    .kdot.send { background: linear-gradient(135deg, #4cc3ff, #5b6cff); }
    .kdot.fx { background: linear-gradient(135deg, #2ee6a6, #9be14a); }
    .ghead { display: flex; align-items: center; gap: 7px; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { background: var(--plate); color: var(--text); font: 12.5px/1.35 ui-rounded, "SF Pro Rounded", system-ui, sans-serif; display: flex; flex-direction: column; user-select: none; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
    button, select, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
    svg { display: block; }
    .top { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--edge); }
    h1 { white-space: nowrap; margin: 0 6px 0 0; font-size: 15px; font-weight: 800; letter-spacing: -.01em; }
    h1 small { font-weight: 600; color: var(--dim); font-size: 10.5px; margin-left: 4px; }
    .lbl { color: var(--dim); font-size: 11px; font-weight: 700; white-space: nowrap; }
    .grow { flex: 1; }
    .theme { display: flex; background: var(--well); border: 1px solid var(--edge); border-radius: 9px; padding: 2px; }
    .theme button { width: 26px; height: 22px; border: 0; border-radius: 7px; background: none; display: grid; place-items: center; padding: 0; color: var(--dim); }
    .theme button.on { background: var(--panel2); color: var(--text); }
    .theme svg { width: 12px; height: 12px; }
    select { background: var(--well); border: 1px solid var(--edge); border-radius: 8px; padding: 4px 7px; font-size: 12px; font-weight: 700; }
    .picker { position: relative; }
    #pickBtn { display: inline-flex; align-items: center; gap: 8px; max-width: 320px; background: var(--well); border: 1px solid var(--edge); border-radius: 9px; padding: 4px 9px; font-weight: 700; font-size: 12px; }
    #pickBtn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #pickBtn svg { width: 11px; height: 11px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; transition: transform .15s; }
    #pickBtn.open { border-color: var(--acc); }
    #pickBtn.open svg { transform: rotate(180deg); }
    .pop { position: absolute; z-index: 30; top: calc(100% + 6px); left: 0; width: 300px; max-height: 420px; display: flex; flex-direction: column; background: var(--panel2); border: 1px solid var(--edge); border-radius: 12px; box-shadow: 0 16px 40px rgba(0,0,0,.5); overflow: hidden; }
    .pop[hidden] { display: none; }
    #pickSearch { margin: 8px; background: var(--well); border: 1px solid var(--edge); border-radius: 8px; padding: 5px 9px; font-size: 12px; outline: none; }
    #pickSearch:focus { border-color: var(--acc); }
    #pickList { overflow-y: auto; padding: 0 6px 8px; display: flex; flex-direction: column; }
    .ghead { color: var(--dim); font-size: 10.5px; font-weight: 800; padding: 6px 8px 3px; }
    .grp { display: flex; align-items: center; gap: 7px; border: 0; background: none; padding: 6px 8px; border-radius: 7px; font-weight: 800; font-size: 12px; text-align: left; color: var(--silk); margin-top: 2px; }
    .grp:hover { background: var(--well); color: var(--text); }
    .grp svg { width: 11px; height: 11px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform .15s; }
    .grp.open svg { transform: rotate(90deg); }
    .grp span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .grp em { font-style: normal; font-size: 10.5px; color: var(--dim); background: var(--well); border-radius: 999px; padding: 0 7px; }
    .grp.has span { color: var(--acc); }
    .item { border: 0; background: none; text-align: left; padding: 5px 10px; border-radius: 7px; font-size: 12px; font-weight: 600; color: var(--text); }
    .item.sub { padding-left: 28px; }
    .item:hover { background: var(--well); }
    .item.on { background: linear-gradient(90deg, color-mix(in srgb, var(--acc) 35%, transparent), transparent); font-weight: 800; }
    #trackName { font-weight: 800; color: var(--acc); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
    main { flex: 1 1 0; min-height: 0; overflow: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 12px; }
    .stage { background: var(--panel); border-radius: 16px; padding: 10px 12px 8px; flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .controls { flex: none; }
    .stagehead { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .stagehead .info { color: var(--dim); font-size: 11.5px; }
    .seg { display: inline-flex; background: var(--well); border: 1px solid var(--edge); border-radius: 9px; padding: 2px; }
    .seg button { border: 0; background: none; border-radius: 7px; padding: 3px 9px; font-size: 11.5px; font-weight: 700; color: var(--dim); display: inline-flex; align-items: center; gap: 5px; }
    .seg button.on { background: var(--panel2); color: var(--text); }
    #wave { display: block; width: 100%; flex: 1 1 0; height: 0; min-height: 96px; }
    .stage { min-height: 140px; }
    .foot { flex: none; }
    .stepnote { color: var(--cwarn, #ffd23f); font-size: 11px; font-weight: 700; margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    #wave .bar { stroke: var(--edge); stroke-width: 1; }
    #wave .beat { stroke: var(--edge); stroke-width: 1; stroke-dasharray: 2 5; }
    #wave .band { fill: color-mix(in srgb, var(--acc) 9%, transparent); }
    #wave .fill { fill: url(#gfill); }
    #wave .line { fill: none; stroke: url(#gline); stroke-width: 2.6; stroke-linejoin: round; stroke-linecap: round; }
    #wave .pt { fill: var(--text); }
    #wave .lab { fill: var(--dim); font-size: 10px; font-weight: 700; }
    #wave .lim { stroke: var(--silk); stroke-width: 1; stroke-dasharray: 5 4; opacity: .6; }
    .controls { display: grid; grid-template-columns: auto 1fr; gap: 12px; }
    .card { background: var(--panel); border-radius: 16px; padding: 10px 12px; }
    .card h3 { margin: 0 0 7px; font-size: 10.5px; font-weight: 800; color: var(--dim); }
    .shapes { display: grid; grid-template-columns: repeat(4, 62px); gap: 5px; }
    .shape { height: 52px; border-radius: 10px; border: 1px solid var(--edge); background: var(--well); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 0; color: var(--dim); }
    .shape svg { width: 36px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .shape span { font-size: 10px; font-weight: 700; }
    .shape:hover { color: var(--text); border-color: var(--silk); }
    .shape.on { color: var(--ink); background: linear-gradient(135deg, var(--acc), var(--acc2)); border: 0; }
    .knobrow { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; }
    .knob { display: flex; flex-direction: column; align-items: center; width: 64px; }
    .knob svg { width: 44px; height: 44px; cursor: ns-resize; touch-action: none; }
    .kl { font-size: 10.5px; color: var(--dim); font-weight: 700; white-space: nowrap; }
    .kv { font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .ktrack { fill: none; stroke: var(--well); stroke-width: 4.5; stroke-linecap: round; }
    .kval { fill: none; stroke: url(#kgrad); stroke-width: 4.5; stroke-linecap: round; }
    .kptr { stroke: var(--text); stroke-width: 2.5; stroke-linecap: round; }
    .rate { display: flex; flex-direction: column; gap: 6px; min-width: 150px; }
    .btn { border: 1px solid var(--edge); background: var(--well); border-radius: 9px; padding: 5px 12px; font-weight: 700; font-size: 12px; display: inline-flex; align-items: center; gap: 6px; }
    .btn:hover { border-color: var(--silk); }
    .btn:disabled { opacity: .4; cursor: default; }
    .btn svg { width: 16px; height: 16px; }
    .btn.main { background: linear-gradient(90deg, var(--acc), var(--acc2)); border: 0; color: var(--ink); font-weight: 800; padding: 7px 20px; font-size: 13px; }
    .foot { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--edge); }
    .status { font-size: 12px; color: var(--dim); }
    .status.ok { color: var(--ok); } .status.bad { color: var(--bad); }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute"><defs>
    <linearGradient id="kgrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="var(--acc)"/><stop offset="1" stop-color="var(--acc2)"/></linearGradient>
  </defs></svg>
  <div class="top">
    <h1>Modulators <small id="ver"></small></h1>
    <span class="lbl" id="targetLabel"></span>
    <span id="trackName"></span>
    <div class="picker" id="picker">
      <button id="pickBtn"><span id="pickLabel"></span><svg viewBox="0 0 12 12"><path d="M3 4.5L6 7.5L9 4.5"/></svg></button>
      <div class="pop" id="pop" hidden><input type="search" id="pickSearch" spellcheck="false" autocomplete="off"><div id="pickList"></div></div>
    </div>
    <span class="grow"></span>
    <button id="help"></button>
    <div class="theme">
      <button data-t="dark" id="tDark"><svg viewBox="0 0 16 16"><path d="M13.5 10.2A6 6 0 0 1 5.8 2.5a6 6 0 1 0 7.7 7.7z" fill="currentColor"/></svg></button>
      <button data-t="grey" id="tGrey"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 2.5a5.5 5.5 0 0 1 0 11z" fill="currentColor"/></svg></button>
    </div>
    <select id="lang"></select>
  </div>
  <main>
    <div class="stage">
      <div class="stagehead"><span class="lbl" id="spanLabel"></span><div class="seg" id="span"></div><span class="info" id="spanInfo"></span><span class="stepnote" id="stepNote" hidden></span></div>
      <svg id="wave" preserveAspectRatio="none"></svg>
    </div>
    <div class="controls">
      <div class="card"><h3 id="shapeLabel"></h3><div class="shapes" id="shapes"></div></div>
      <div class="card">
        <div class="knobrow">
          <div class="rate"><h3 id="rateLabel" style="margin:0"></h3><select id="rate"></select><div class="seg" id="feel"></div></div>
          <div class="knobrow" id="knobs"></div>
          <span class="grow"></span>
          <button class="btn" id="dice"></button>
        </div>
      </div>
    </div>
  </main>
  <div class="foot">
    <span class="status" id="status" role="status"></span>
    <span class="grow"></span>
    <button class="btn" id="undo"></button>
    <button class="btn" id="clear"></button>
    <button class="btn main" id="write"></button>
  </div>
  <script src="vendor/luna.global.js"></script>
  <script src="tour.js"></script>
  <script src="main.js"></script>
</body>
</html>
